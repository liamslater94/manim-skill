<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manim Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%226%22 fill=%22%232BB5A0%22/%3E%3C/svg%3E">
<style>
  :root {
    --bg-main: #f8f8f7; --bg-card: #ffffff; --bg-soft: #f2f2f0; --bg-hover: #ececea;
    --text-primary: #34322d; --text-secondary: #5e5e5b; --text-tertiary: #858481;
    --border: rgba(0,0,0,0.08); --border-input: rgba(0,0,0,0.14);
    --accent: #2BB5A0; --accent-hover: #239687; --accent-muted: rgba(43,181,160,0.14);
    --warn: #c98a12; --warn-muted: rgba(201,138,18,0.12);
    --danger: #d0453b; --danger-muted: rgba(208,69,59,0.10);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Figtree", sans-serif;
    --mono: "SF Mono", Menlo, Monaco, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg-main: #161616; --bg-card: #1f1f1f; --bg-soft: #262626; --bg-hover: #2e2e2e;
      --text-primary: #ececeb; --text-secondary: #b6b6b3; --text-tertiary: #8a8a87;
      --border: rgba(255,255,255,0.08); --border-input: rgba(255,255,255,0.16);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); background: var(--bg-main); color: var(--text-primary);
         font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  .app { display: grid; grid-template-columns: 280px 1fr; height: 100vh; }
  .app > * { min-width: 0; }
  h1, .sub { overflow-wrap: anywhere; }
  aside { border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
  .brand { padding: 18px 18px 12px; font-weight: 650; font-size: 16px; display: flex; align-items: center; gap: 8px; }
  .brand .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
  .side-actions { padding: 0 12px 10px; display: flex; gap: 8px; }
  .jobs { overflow-y: auto; padding: 4px 8px 16px; flex: 1; }
  .job { padding: 9px 10px; border-radius: 8px; cursor: pointer; margin-bottom: 2px; }
  .job:hover { background: var(--bg-hover); }
  .job.active { background: var(--accent-muted); }
  .job .t { font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .job .s { font-size: 12px; color: var(--text-tertiary); display: flex; align-items: center; gap: 6px; }
  .empty-side { color: var(--text-tertiary); padding: 12px 10px; font-size: 13px; }
  main { overflow-y: auto; min-height: 0; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 28px 32px 60px; }
  h1 { font-size: 22px; font-weight: 650; margin-bottom: 4px; }
  h2 { font-size: 15px; font-weight: 650; margin-bottom: 10px; }
  .sub { color: var(--text-tertiary); font-size: 13px; }
  .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; margin-top: 16px; }
  label { display: block; font-size: 13px; font-weight: 550; color: var(--text-secondary); margin: 12px 0 6px; }
  textarea, input[type=text], input[type=number], select {
    width: 100%; font: inherit; color: var(--text-primary); background: var(--bg-card);
    border: 1px solid var(--border-input); border-radius: 8px; padding: 9px 11px; }
  textarea { resize: vertical; min-height: 90px; }
  textarea.mono, pre { font-family: var(--mono); font-size: 12.5px; line-height: 1.55; }
  textarea:focus, input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  .row { display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
  .row > * { flex: 1; min-width: 160px; }
  .btn { font: inherit; font-weight: 550; border: 1px solid var(--border-input); background: var(--bg-card);
         color: var(--text-primary); border-radius: 8px; padding: 8px 14px; cursor: pointer; white-space: nowrap; }
  .btn:hover { background: var(--bg-hover); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: var(--accent-hover); }
  .btn.danger { color: var(--danger); }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .btn.full { width: 100%; }
  .actions { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; align-items: center; }
  .pill { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--bg-soft); color: var(--text-secondary); white-space: nowrap; }
  .pill.wait { background: var(--warn-muted); color: var(--warn); }
  .pill.run { background: var(--accent-muted); color: var(--accent-hover); }
  .pill.ok { background: var(--accent); color: #fff; }
  .pill.bad { background: var(--danger-muted); color: var(--danger); }
  .spin { width: 12px; height: 12px; border: 2px solid var(--accent-muted); border-top-color: var(--accent); border-radius: 50%; animation: s 0.9s linear infinite; display: inline-block; }
  @keyframes s { to { transform: rotate(360deg); } }
  .steps { display: flex; gap: 0; margin-top: 18px; }
  .step { flex: 1; padding: 10px 12px; border-top: 3px solid var(--bg-hover); color: var(--text-tertiary); font-size: 13px; font-weight: 550; }
  .step.done { border-color: var(--accent); color: var(--text-secondary); }
  .step.now { border-color: var(--accent); color: var(--text-primary); }
  .step .n { font-size: 11.5px; font-weight: 500; color: var(--text-tertiary); }
  .banner { margin-top: 16px; padding: 12px 14px; border-radius: 10px; display: flex; gap: 12px; align-items: center; }
  .banner.run { background: var(--accent-muted); }
  .banner.wait { background: var(--warn-muted); }
  .banner.bad { background: var(--danger-muted); }
  .banner .msg { flex: 1; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .grid2 > .card { margin-top: 0; }
  pre { white-space: pre-wrap; word-wrap: break-word; background: var(--bg-soft); border-radius: 8px; padding: 12px; max-height: 520px; overflow: auto; }
  pre.log { max-height: 340px; color: var(--text-secondary); }
  video { width: 100%; border-radius: 10px; background: #000; display: block; }
  details summary { cursor: pointer; font-weight: 600; color: var(--text-secondary); }
  .qimg { max-width: 100%; max-height: 260px; border-radius: 8px; border: 1px solid var(--border); margin-top: 10px; }
  .paste { border: 1.5px dashed var(--border-input); border-radius: 10px; padding: 14px; color: var(--text-tertiary); text-align: center; margin-top: 10px; cursor: pointer; }
  .paste.has { border-style: solid; }
  .paste img { max-height: 220px; max-width: 100%; border-radius: 6px; display: block; margin: 0 auto 8px; }
  .health { margin-top: 10px; }
  .health li { margin: 4px 0 4px 18px; }
  .hint { font-size: 12.5px; color: var(--text-tertiary); margin-top: 6px; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #27272a; color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 10; }
  .toast.show { opacity: 1; }
  .muted { color: var(--text-tertiary); }
  a { color: var(--accent-hover); }
  @media (prefers-color-scheme: dark) { a { color: var(--accent); } }
  .check { display: flex; gap: 10px; align-items: flex-start; font-weight: 500; color: var(--text-primary); margin-top: 12px; }
  .check input { margin-top: 3px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 8px; }
  .tile { border: 2px solid transparent; border-radius: 10px; cursor: pointer; overflow: hidden; background: var(--bg-soft); }
  .tile.sel { border-color: var(--accent); }
  .tile img { width: 100%; display: block; }
  .tile .cap { font-size: 12px; padding: 6px 8px; color: var(--text-secondary); }
  .pick { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; padding: 12px 0; border-top: 1px solid var(--border); align-items: center; }
  .pick audio { width: 100%; height: 34px; }
  .bar { height: 6px; background: var(--bg-soft); border-radius: 99px; overflow: hidden; margin-top: 8px; }
  .bar > div { height: 100%; background: var(--accent); transition: width .4s; }
  .verdict { padding: 12px 14px; border-radius: 10px; margin-top: 10px; }
  .verdict.agree { background: var(--accent-muted); }
  .verdict.disagree { background: var(--danger-muted); }
  .verdict.unsure { background: var(--warn-muted); }
  .verdict ul { margin: 6px 0 0 18px; }
  .titles li { display: flex; gap: 10px; align-items: center; padding: 6px 0; border-top: 1px solid var(--border); list-style: none; }
  .titles li span { flex: 1; }
  .plan-v { padding: 10px 0; border-top: 1px solid var(--border); display: flex; gap: 12px; align-items: flex-start; }
  .plan-v > div { flex: 1; min-width: 0; }
  video.vertical { max-width: 320px; margin: 0 auto; }
  .prompter { background: #0b0f14; color: #f4f1ea; border-radius: 12px; padding: 22vh 28px; margin-top: 14px; max-height: 56vh; overflow-y: auto; position: relative; scroll-behavior: smooth; }
  .pl { font-size: 20px; line-height: 1.45; color: rgba(244,241,234,0.38); margin: 0 0 18px; transition: color .2s, font-size .2s; }
  .pl.cur { font-size: 30px; font-weight: 650; color: #fff; }
  .pl.done { color: rgba(244,241,234,0.22); }
  .pl .pz { font-size: 13px; font-weight: 600; color: #FFD23F; border: 1px solid rgba(255,210,63,0.5); border-radius: 99px; padding: 1px 8px; margin-left: 8px; vertical-align: middle; white-space: nowrap; }
  .count { position: sticky; top: 30%; text-align: center; font-size: 90px; font-weight: 700; color: #FFD23F; height: 0; overflow: visible; }
  .meter { height: 8px; border-radius: 99px; background: var(--bg-soft); overflow: hidden; min-width: 140px; }
  .meter > div { height: 100%; width: 0; background: var(--accent); transition: width .08s; }
  .meter.hot > div { background: var(--danger); }
  .recdot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--danger); animation: blink 1s infinite; margin-right: 6px; }
  @keyframes blink { 50% { opacity: .25; } }
  kbd { font-family: var(--mono); font-size: 12px; border: 1px solid var(--border-input); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; }
  .take { display: grid; grid-template-columns: 28px 230px 1fr auto; gap: 8px 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--border); }
  .take audio { width: 100%; height: 34px; }
  .take .warn { grid-column: 3 / 5; font-size: 12.5px; color: var(--warn); }
  .take.flag { background: var(--warn-muted); border-radius: 8px; padding: 10px 8px; }
  .liverec { grid-column: 1 / 5; padding: 12px; border-radius: 10px; background: var(--bg-soft); }
  .liverec .big { font-size: 22px; font-weight: 600; margin: 6px 0 10px; }
  @media (max-width: 860px) {
    .grid3 { grid-template-columns: 1fr; }
    .take { grid-template-columns: 24px 1fr; } .take > :nth-child(n+3) { grid-column: 1 / 3; }
    .pl.cur { font-size: 24px; }
    .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; height: auto; min-height: 100vh; }
    aside { border-right: none; border-bottom: 1px solid var(--border); max-height: 40vh; }
    .grid2 { grid-template-columns: 1fr; }
    .wrap { padding: 20px 16px 48px; }
    .steps .n { display: none; }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><span class="dot"></span>Manim Studio</div>
    <div class="side-actions">
      <button class="btn primary full" onclick="go('new')">+ New video</button>
      <button class="btn" onclick="go('settings')" title="Voice & settings">⚙</button>
    </div>
    <div class="side-actions"><button class="btn full" onclick="go('plans')">Plan a series</button></div>
    <div class="jobs" id="jobs"></div>
  </aside>
  <main><div class="wrap" id="view"></div></main>
</div>
<div class="toast" id="toast"></div>

<script>
const STATUS = {
  queued_script: ["Waiting to write script", "run"], scripting: ["Writing script", "run"],
  script_ready: ["Check the script", "wait"],
  queued_check: ["Waiting to check the maths", "run"], checking: ["Checking the maths", "run"],
  record: ["Record your narration", "wait"], queued_takes: ["Waiting to process recording", "run"],
  processing: ["Processing your recording", "run"], takes_review: ["Check your recording", "wait"],
  queued_voice: ["Waiting to voice", "run"], voicing: ["Recording voice", "run"],
  queued_video: ["Waiting to animate", "run"], rendering: ["Animating", "run"],
  review: ["Watch & review", "wait"],
  queued_revise: ["Waiting to apply changes", "run"], revising: ["Applying your changes", "run"],
  queued_export: ["Waiting to export", "run"], exporting: ["Exporting 1080p", "run"],
  done: ["Ready for YouTube", "ok"], failed: ["Failed", "bad"], cancelled: ["Cancelled", "bad"],
};
const STEP_OF = { queued_script: 0, scripting: 0, script_ready: 0, queued_check: 0, checking: 0,
  record: 1, queued_takes: 1, processing: 1, takes_review: 1, queued_voice: 1, voicing: 1,
  queued_video: 2, rendering: 2, review: 2, queued_revise: 2, revising: 2, queued_export: 3, exporting: 3, done: 4 };
const RUN_TEXT = {
  scripting: "Claude is writing the narration and a worked solution, then a second Claude checks the maths independently.",
  checking: "A second Claude is solving the question from scratch and comparing it with the script.",
  processing: "Cleaning up your recording, splitting it into lines and checking each one against the script.",
  voicing: "Narrating in your voice and checking every take. This takes a few minutes.",
  rendering: "Claude is writing and rendering the animation, then checking frames. Usually 10–25 minutes.",
  revising: "Claude is applying your notes and re-rendering the affected scenes.",
  exporting: "Rendering 1080p, then titles, thumbnails, Short, worksheet, end screen and audio mastering.",
};
let state = { view: "new", jobs: [], job: null, health: null, settings: null, image: null, thumb: 0, pick: null, plans: [] };
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function api(path, body) {
  const opts = body === undefined ? {} : { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body) };
  const r = await fetch(path, opts);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2600); }
async function act(action, body = {}) {
  try { state.job = await api(`/api/jobs/${state.job.id}/${action}`, body); await refresh(true); }
  catch (e) { toast(e.message); }
}
function go(view) {
  if (view !== state.view) { state.job = null; state.dirty = false; state.thumb = 0; lastSig = ""; }
  state.view = view;
  history.replaceState(null, "", view.startsWith("job:") ? "#" + view : location.pathname);
  render(); refresh(true);
}

function pill(status) { const [t, c] = STATUS[status] || [status, ""]; return `<span class="pill ${c}">${c === "run" && !status.startsWith("queued") ? '<span class="spin"></span> ' : ""}${esc(t)}</span>`; }

function renderJobs() {
  const el = $("#jobs");
  if (!state.jobs.length) { el.innerHTML = `<div class="empty-side">Your videos will appear here.</div>`; return; }
  el.innerHTML = state.jobs.map(j => `<div class="job ${state.view === "job:" + j.id ? "active" : ""}" onclick="go('job:${j.id}')">
    <div class="t">${esc(j.title)}</div><div class="s">${pill(j.status)}</div></div>`).join("");
}

function healthCard() {
  const h = state.health; if (!h) return "";
  const c = h.checks, miss = [];
  if (!c.claude) miss.push("<b>Claude Code</b> isn't on PATH: install it (<code>brew install --cask claude-code</code>) and sign in, or set its path in Settings.");
  if (!c.manim) miss.push("<b>manim</b> isn't importable: start the studio from the project's environment (<code>source ~/manim-skill/.venv/bin/activate</code>).");
  if (!c.latex) miss.push("<b>LaTeX</b> isn't on PATH: <code>brew install --cask mactex-no-gui</code>, then open a new terminal.");
  if (!c.ffmpeg) miss.push("<b>ffmpeg</b> is missing: <code>brew install ffmpeg</code>.");
  if (!c.voice_sample) miss.push("No <b>voice sample</b> yet: add one in <a href=\"#\" onclick=\"go('settings');return false\">Settings</a>, or videos use the stock Kokoro voice.");
  else if (!c.sherpa_onnx) miss.push("<b>sherpa-onnx</b> is missing (needed for your voice): <code>uv sync</code> in the project folder.");
  if (!miss.length) return "";
  return `<div class="card"><h2>Before your first video</h2><ul class="health">${miss.map(m => `<li>${m}</li>`).join("")}</ul></div>`;
}

function renderNew() {
  const s = state.settings || {};
  $("#view").innerHTML = `
    <h1>New explainer video</h1>
    <div class="sub">Paste a question or topic. Claude writes a script for you to check, your voice narrates it, and the animation is built to match.</div>
    ${healthCard()}
    <div class="card">
      <label for="q">Question or topic</label>
      <textarea id="q" rows="7" placeholder="e.g. Use mathematical induction to prove that 5ⁿ − 1 is divisible by 4 for all n ∈ ℤ⁺.&#10;&#10;Or a topic: 'Why the derivative of sin x is cos x'"></textarea>
      <div class="paste" id="paste" tabindex="0">Paste a screenshot of the question here (⌘V), or click to choose an image</div>
      <input type="file" id="file" accept="image/*" hidden>
      <div class="row">
        <div><label for="aud">Audience</label><input type="text" id="aud" value="${esc(s.audience || "")}"></div>
        <div style="max-width:180px"><label for="min">Target length (min)</label><input type="number" id="min" min="1" max="20" step="0.5" value="${esc(s.minutes || 4)}"></div>
      </div>
      <div class="row">
        <div><label for="src">Exam reference (optional)</label><input type="text" id="src" placeholder="e.g. May 2024 Paper 1 Q9"><div class="hint">Students search for these; it goes in the title and description.</div></div>
        <div><label for="ser">Series / playlist (optional)</label><input type="text" id="ser" placeholder="e.g. Vectors"></div>
      </div>
      <div class="actions"><button class="btn primary" id="create">Write the script</button>
      <span class="muted" id="cmsg"></span></div>
    </div>`;
  const paste = $("#paste");
  const showImage = () => { paste.classList.toggle("has", !!state.image);
    paste.innerHTML = state.image ? `<img src="${state.image.data}" alt="Question image"><span>Image attached · <a href="#" id="rmimg">remove</a></span>` : "Paste a screenshot of the question here (⌘V), or click to choose an image";
    const rm = $("#rmimg"); if (rm) rm.onclick = (e) => { e.preventDefault(); e.stopPropagation(); state.image = null; showImage(); }; };
  const readFile = (f) => { if (!f || !f.type.startsWith("image/")) return; const r = new FileReader(); r.onload = () => { state.image = { type: f.type, data: r.result }; showImage(); }; r.readAsDataURL(f); };
  paste.onclick = () => $("#file").click();
  $("#file").onchange = (e) => readFile(e.target.files[0]);
  document.onpaste = (e) => { if (state.view !== "new") return; const item = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith("image/")); if (item) { e.preventDefault(); readFile(item.getAsFile()); } };
  showImage();
  $("#create").onclick = async () => {
    const btn = $("#create"); btn.disabled = true; $("#cmsg").textContent = "Starting…";
    try {
      const job = await api("/api/jobs", { question: $("#q").value, audience: $("#aud").value, minutes: parseFloat($("#min").value) || 4, image: state.image, source: $("#src").value, series: $("#ser").value });
      state.image = null; go("job:" + job.id);
    } catch (e) { toast(e.message); btn.disabled = false; $("#cmsg").textContent = ""; }
  };
}

function renderSettings() {
  const s = state.settings; if (!s) { $("#view").innerHTML = "Loading…"; return; }
  const voiceName = s.voice_sample ? s.voice_sample.split("/").pop() : "";
  const musicName = s.music_file ? s.music_file.split("/").pop() : "";
  const box = (id, on, title, hint) => `<label class="check"><input type="checkbox" id="${id}" ${on ? "checked" : ""}><span>${title}<span class="hint" style="display:block;margin-top:2px">${hint}</span></span></label>`;
  $("#view").innerHTML = `
    <h1>Voice & settings</h1>
    <div class="card">
      <h2>Narration</h2>
      <label class="check"><input type="radio" name="vmode" value="record" ${s.voice_mode !== "clone" ? "checked" : ""}><span>Record it myself <span class="pill ok">recommended</span><span class="hint" style="display:block;margin-top:2px">After you approve the script, the app shows it as a teleprompter and records you reading it in one take with your Mac's microphone. Your real voice, pace and emphasis; the animation is timed to it.</span></span></label>
      <label class="check"><input type="radio" name="vmode" value="clone" ${s.voice_mode === "clone" ? "checked" : ""}><span>Cloned voice<span class="hint" style="display:block;margin-top:2px">The app reads the script in a clone of your voice. No recording needed, but it sounds less natural.</span></span></label>
    </div>
    <div class="card">
      <h2>Cloned voice</h2>
      <div class="sub">Only used when Narration is set to Cloned voice. The clone copies about 12 seconds of you, so the best 12 seconds matter more than a long recording.</div>
      <h2 style="margin-top:16px;font-size:14px">Find my best clip <span class="pill ok">recommended</span></h2>
      <div class="sub">Read the <a href="/voice-script" target="_blank">recording script</a> (about 5 minutes) in one go and upload it. The app clones a test line from every take, scores how much each sounds like you, and lets you listen to the best before choosing. Takes about 10 minutes.</div>
      <div class="actions"><input type="file" id="longrec" accept="audio/*,video/*" hidden>
        <button class="btn primary" onclick="$('#longrec').click()">Upload recording & find my best clip</button></div>
      <div id="vp"></div>
      <h2 style="margin-top:18px;font-size:14px">Or use a short sample</h2>
      <div class="actions"><input type="file" id="voice" accept="audio/*,video/*" hidden>
        <button class="btn" onclick="$('#voice').click()">${voiceName ? "Replace voice sample" : "Upload voice sample"}</button>

async function recordSignoff() {
  if (REC.active || !(await micOpen())) return;
  const bar = $("#sorec");
  bar.innerHTML = `<div class="liverec" style="width:100%"><div class="muted">Read this, then press Stop:</div><div class="big">${esc($("#signoff").value)}</div>
    <div class="row" style="align-items:center"><div class="meter"><div></div></div><div style="flex:0;min-width:auto;display:flex;gap:8px" id="sobtn">
    <button class="btn primary" id="sostart">● Start</button></div></div></div>`;
  $("#sostart").onclick = () => {
    REC.active = true; REC.line = -1;
    startRecorder(async (blob) => {
      try {
        const r = await fetch("/api/signoff", { method: "POST", body: blob, headers: { "X-Filename": encodeURIComponent("signoff" + extFor(REC.mime)) } });
        const d = await r.json(); if (!r.ok) throw new Error(d.error); toast(`Sign-off saved (${d.signoff_seconds}s)`);
      } catch (err) { toast(err.message); }
      REC.active = false; REC.line = null; micClose(); renderSettings();
    });
    $("#sobtn").innerHTML = `<span><span class="recdot"></span>Recording</span><button class="btn primary" onclick="liveStop()">■ Stop</button>`;
  };
}
async function clearMusic() { try { state.settings = await api("/api/music/clear", {}); renderSettings(); } catch (e) { toast(e.message); } }

function renderPick() {
  const el = $("#vp"), p = state.pick; if (!el || !p || p.status === "none") { if (el) el.innerHTML = ""; return; }
  if (p.status === "running") {
    const [d, t] = p.progress || [0, 0];
    el.innerHTML = `<div class="banner run"><span class="spin"></span><div class="msg">${t ? `Testing take ${d} of ${t}…` : "Finding the takes in your recording…"}
      <div class="bar"><div style="width:${t ? Math.round(100 * (d - 1) / t) : 3}%"></div></div></div></div>`;
    return;
  }
  if (p.status === "failed") { el.innerHTML = `<div class="banner bad"><div class="msg"><b>Couldn't test that recording.</b><pre class="log" style="margin-top:8px">${esc((p.log || "").slice(-1200))}</pre></div></div>`; return; }
  const rows = (p.results || []).slice(0, 3).map((r, i) => `<div class="pick">
      <div><b>${i === 0 ? "Best match" : "#" + (i + 1)}</b><div class="muted" style="font-size:12px">${Math.round(r.likeness * 100)}% like you · ${Math.round(r.clarity * 100)}% clear</div></div>
      <div class="muted" style="font-size:12.5px">“${esc(r.transcript.slice(0, 140))}${r.transcript.length > 140 ? "…" : ""}” (${r.seconds}s, at ${Math.floor(r.start_s / 60)}:${String(Math.floor(r.start_s % 60)).padStart(2, "0")})</div>
      <div class="muted" style="font-size:12px">Your take</div><audio controls preload="none" src="/voice-pick/${r.clip}?v=${r.score}"></audio>
      <div class="muted" style="font-size:12px">Clone test</div><audio controls preload="none" src="/voice-pick/${r.test}?v=${r.score}"></audio>
      <div></div><div>${p.in_use === r.id ? `<span class="pill ok">✓ In use</span>` : `<button class="btn ${i === 0 ? "primary" : ""}" onclick="usePick('${r.id}')">Use this clip</button>`}</div>
    </div>`).join("");
  el.innerHTML = `<div style="margin-top:12px"><div class="sub">Listen to the clone tests and choose the one that sounds most like you. The score is a guide; your ears decide.</div>${rows}</div>`;
}

function stepper(status, mode) {
  const at = status === "failed" || status === "cancelled" ? -1 : (STEP_OF[status] ?? 0);
  const names = [["Script", "Claude writes, you check"], ["Voice", mode === "clone" ? "your cloned voice" : "you read it aloud"], ["Video", "animation + your review"], ["Export", "1080p + YouTube text"]];
  return `<div class="steps">${names.map(([n, d], i) => `<div class="step ${i < at ? "done" : i === at ? "now" : ""}">${n}<div class="n">${d}</div></div>`).join("")}</div>`;
}

function renderJob() {
  const j = state.job; if (!j) { $("#view").innerHTML = `<div class="muted">Loading…</div>`; return; }
  const v = (name) => j.files[name] ? `/files/${j.id}/${name}?v=${j.files[name]}` : "";
  const running = RUN_TEXT[j.status];
  let banner = "";
  if (running) banner = `<div class="banner run"><span class="spin"></span><div class="msg">${running}</div><button class="btn" onclick="act('cancel')">Cancel</button></div>`;
  else if (j.status.startsWith("queued_")) banner = `<div class="banner run"><div class="msg">${esc(STATUS[j.status][0])}: another video is using the renderer; this starts automatically.</div><button class="btn" onclick="act('cancel')">Cancel</button></div>`;
  else if (j.status === "record") banner = `<div class="banner wait"><div class="msg"><b>Your turn:</b> read the script aloud. It's one take: tap <kbd>Space</kbd> as you start each new line and keep going. You can redo any line afterwards.</div></div>`;
  else if (j.status === "takes_review") banner = `<div class="banner wait"><div class="msg"><b>Your turn:</b> listen back. Re-record any line you're not happy with, then use the recording.</div></div>`;
  else if (j.status === "script_ready") banner = `<div class="banner wait"><div class="msg"><b>Your turn:</b> check the worked solution and narration. Edit directly or ask for changes, then approve.</div></div>`;
  else if (j.status === "review") banner = `<div class="banner wait"><div class="msg"><b>Your turn:</b> watch the video. Note anything to fix (use “Add timestamp”), or export it for YouTube.</div></div>`;
  else if (j.status === "failed" || j.status === "cancelled") banner = `<div class="banner bad"><div class="msg"><b>${j.status === "failed" ? "Something went wrong" : "Cancelled"}</b>${j.error ? ": " + esc(j.error) : ""}. The activity log below has details.</div><button class="btn primary" onclick="act('retry')">Retry</button></div>`;
  else if (j.status === "done") banner = `<div class="banner run"><div class="msg"><b>Done.</b> Download the 1080p video and paste the YouTube text below.</div></div>`;

  const question = `<details class="card" ${["queued_script","scripting"].includes(j.status) ? "open" : ""}><summary>Question</summary>
    <pre style="margin-top:10px">${esc(j.question || "(from image)")}</pre>${j.image && v(j.image) ? `<img class="qimg" src="${v(j.image)}" alt="Question image">` : ""}</details>`;

  let body = "";
  if (j.status === "script_ready") {
    const c = j.check;
    const verdict = c ? `<div class="card"><h2>Independent maths check</h2>
      <div class="verdict ${esc(c.verdict)}"><b>${c.verdict === "agree" ? "✓ A second Claude solved it independently and agrees." : c.verdict === "disagree" ? "⚠ A second Claude got something different. Check before approving." : "? The check couldn't settle it. Read the solution carefully."}</b>
        <div style="margin-top:4px">${esc(c.summary)}</div>${c.issues && c.issues.length ? `<ul>${c.issues.map(i => `<li>${esc(i)}</li>`).join("")}</ul>` : ""}</div>
      <div class="actions"><button class="btn" onclick="act('check')">Check again</button>${c.issues && c.issues.length ? `<button class="btn" onclick="fixIssues()">Ask Claude to fix these</button>` : ""}</div></div>` : "";
    body = verdict + `<div class="grid2" style="margin-top:16px">
      <div class="card"><h2>Outline & worked solution</h2><pre>${esc(j.outline || "(no outline)")}</pre></div>
      <div class="card"><h2>Narration</h2><textarea class="mono" id="narr" rows="22">${esc(j.narration)}</textarea>
        <div class="hint">One line per subtitle. <code>[pause 2.5]</code> adds thinking time after a line.</div>
        <div class="actions"><button class="btn" onclick="saveNarration()">Save edits</button></div></div></div>
      <div class="card"><h2>Ask Claude for changes</h2><textarea id="notes" rows="3" placeholder="e.g. Explain why we can divide by 4 more slowly, and add a check of the base case n = 1."></textarea>
        <div class="actions"><button class="btn" onclick="act('rescript', {notes: $('#notes').value})">Rewrite script</button>
        <span style="flex:1"></span><button class="btn primary" onclick="approve()">${(state.settings || {}).voice_mode === "clone" ? "Approve → voice & animate" : "Approve → record it"}</button></div></div>`;
  } else if (j.status === "record") {
    body = recorderCard(j);
  } else if (j.status === "takes_review") {
    body = takesCard(j, v);
  } else if (["review", "done"].includes(j.status) || (v("video.mp4") && !["scripting","queued_script"].includes(j.status))) {
    const final = j.status === "done" && v("video_1080p.mp4");
    body = `<div class="card"><h2>${final ? "Final video (1080p)" : "Video"}</h2>
      ${v(final ? "video_1080p.mp4" : "video.mp4") ? `<video id="player" controls preload="metadata" src="${v(final ? "video_1080p.mp4" : "video.mp4")}"></video>` : `<div class="muted">The video will appear here.</div>`}
      ${final ? `<div class="actions"><a class="btn primary" href="${v("video_1080p.mp4")}" download="${j.id}.mp4">Download 1080p MP4</a></div>` : ""}</div>`;
    if (["review", "done"].includes(j.status)) {
      body += `<div class="card"><h2>Changes</h2><textarea id="notes" rows="4" placeholder="e.g. [0:42] the label overlaps the plane: move it up. [1:30] say this step more slowly."></textarea>
        <div class="actions"><button class="btn" onclick="addStamp()">Add timestamp</button><button class="btn" onclick="act('revise', {notes: $('#notes').value})">Apply changes</button><button class="btn" onclick="revoice()" title="Record the narration again with the current voice settings, then re-time the animation">Re-record voice</button>
        <span style="flex:1"></span><button class="btn primary" onclick="act('export')">${j.status === "done" ? "Re-export" : "Export for YouTube"}</button></div></div>`;

// ------------------------------------------------------------ recording --
const REC = { stream: null, ctx: null, analyser: null, raf: 0, mr: null, chunks: [], t0: 0, marks: [], cuts: [], i: 0,
  active: false, busy: false, line: null, onstop: null };
const pickMime = () => ["audio/webm;codecs=opus", "audio/mp4", "audio/webm", "audio/ogg"].find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || "";
const extFor = (mime) => mime.includes("mp4") ? ".m4a" : mime.includes("ogg") ? ".ogg" : ".webm";
const fmtT = (t) => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, "0")}`;

async function micOpen() {
  if (REC.stream && REC.stream.active) return true;
  if (!navigator.mediaDevices?.getUserMedia) { toast("This browser can't record audio. Try Chrome or Safari."); return false; }
  let dev = ""; try { dev = localStorage.getItem("mic") || ""; } catch (e) {}
  const want = { echoCancellation: false, noiseSuppression: false, autoGainControl: true, channelCount: 1 };
  try { REC.stream = await navigator.mediaDevices.getUserMedia({ audio: dev ? { ...want, deviceId: { exact: dev } } : want }); }
  catch (e) {
    try { REC.stream = await navigator.mediaDevices.getUserMedia({ audio: want }); }
    catch (e2) { toast("Microphone blocked. Allow it in the browser (the icon in the address bar), then try again."); return false; }
  }
  REC.ctx = new (window.AudioContext || window.webkitAudioContext)();
  const src = REC.ctx.createMediaStreamSource(REC.stream);
  REC.analyser = REC.ctx.createAnalyser(); REC.analyser.fftSize = 1024; src.connect(REC.analyser);
  const buf = new Float32Array(REC.analyser.fftSize);
  const tick = () => {
    REC.analyser.getFloatTimeDomainData(buf);
    let peak = 0; for (const x of buf) peak = Math.max(peak, Math.abs(x));
    document.querySelectorAll(".meter").forEach(m => { m.firstElementChild.style.width = Math.min(100, Math.round(peak * 140)) + "%"; m.classList.toggle("hot", peak > 0.92); });
    REC.raf = requestAnimationFrame(tick);
  };
  cancelAnimationFrame(REC.raf); tick();
  await fillMics();
  return true;
}
async function fillMics() {
  const sel = $("#micsel"); if (!sel || !navigator.mediaDevices?.enumerateDevices) return;
  const list = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === "audioinput");
  const cur = REC.stream?.getAudioTracks()[0]?.getSettings().deviceId || "";
  sel.innerHTML = list.map((d, k) => `<option value="${esc(d.deviceId)}" ${d.deviceId === cur ? "selected" : ""}>${esc(d.label || "Microphone " + (k + 1))}</option>`).join("");
}
async function chooseMic(id) {
  try { localStorage.setItem("mic", id); } catch (e) {}
  if (REC.stream) REC.stream.getTracks().forEach(t => t.stop()); REC.stream = null;
  await micOpen();
}
function micClose() {
  cancelAnimationFrame(REC.raf);
  if (REC.stream) REC.stream.getTracks().forEach(t => t.stop());
  if (REC.ctx) REC.ctx.close().catch(() => {});
  REC.stream = REC.ctx = REC.analyser = null;
}
function startRecorder(onstop) {
  const mime = pickMime();
  REC.mr = new MediaRecorder(REC.stream, mime ? { mimeType: mime, audioBitsPerSecond: 160000 } : {});
  REC.chunks = []; REC.mime = REC.mr.mimeType || mime || "audio/webm";
  REC.mr.ondataavailable = (e) => { if (e.data.size) REC.chunks.push(e.data); };
  REC.mr.onstart = () => { REC.t0 = performance.now(); };
  REC.mr.onstop = () => onstop(new Blob(REC.chunks, { type: REC.mime }));
  REC.mr.start(1000);
}
const now = () => (performance.now() - REC.t0) / 1000;

function recorderCard(j) {
  const lines = j.entries || [];
  return `<div class="card" id="rec"><h2>Record the narration</h2>
    <div class="sub">Read it the way you'd explain it to a student sitting beside you. Press <kbd>Space</kbd> (or <b>Next line</b>) as you start each new line, and keep going without stopping. Fluffed a line? Press <kbd>R</kbd> and read that line again. A yellow <span class="pill wait">pause</span> means leave a moment of thinking time.</div>
    <div class="row" style="align-items:center;margin-top:12px">
      <div style="max-width:320px"><select id="micsel" onchange="chooseMic(this.value)"><option>Microphone…</option></select></div>
      <div class="meter" title="Speak at your normal volume: the bar should reach about two thirds"><div></div></div>
      <div style="flex:0;min-width:auto"><button class="btn" id="mictest" onclick="micOpen()">Test microphone</button></div>
    </div>
    <div class="prompter" id="prompter">${lines.map((e, k) => `<div class="pl" data-k="${k}">${esc(e.text)}${e.hint ? `<span class="pz">pause</span>` : ""}</div>`).join("")}</div>
    <div class="actions" id="recbar"></div>

      <div class="actions"><input type="file" id="recfile" accept="audio/*,video/*" hidden><button class="btn" onclick="$('#recfile').click()">Upload recording</button></div></details>
  </div>`;
}
function drawRecBar() {
  const bar = $("#recbar"); if (!bar) return;
  if (REC.busy) { bar.innerHTML = `<span class="spin"></span> <span>Uploading your recording…</span>`; return; }
  if (!REC.active) { bar.innerHTML = `<button class="btn primary" onclick="beginTake()">● Start recording</button><span class="muted">A 3-second countdown, then the first line lights up.</span>`; return; }
  const n = (state.job.entries || []).length, last = REC.i >= n - 1;
  bar.innerHTML = `<span><span class="recdot"></span><span id="rtime">${fmtT(now())}</span></span>
    <button class="btn primary" onclick="nextLine()">${last ? "Finish ⏎" : "Next line ␣"}</button>
    <button class="btn" onclick="redoLine()">Redo this line (R)</button>
    <span style="flex:1"></span><span class="muted">Line ${REC.i + 1} of ${n}</span>
    <button class="btn danger" onclick="cancelTake()">Cancel</button>`;
}
function showLine() {
  document.querySelectorAll("#prompter .pl").forEach(el => { const k = +el.dataset.k; el.classList.toggle("cur", k === REC.i); el.classList.toggle("done", k < REC.i); });
  const cur = document.querySelector(`#prompter .pl[data-k="${REC.i}"]`), box = $("#prompter");
  if (cur && box) box.scrollTop = cur.offsetTop - box.clientHeight * 0.35;
  drawRecBar();
}
async function beginTake() {
  if (!(await micOpen())) return;
  REC.busy = true; const box = $("#prompter");
  for (const c of [3, 2, 1]) { box.insertAdjacentHTML("afterbegin", `<div class="count">${c}</div>`); await new Promise(r => setTimeout(r, 800)); box.querySelector(".count")?.remove(); }
  REC.busy = false; REC.active = true; REC.i = 0; REC.marks = [0]; REC.cuts = [];
  startRecorder(uploadTake);
  showLine();
  REC.timer = setInterval(() => { const t = $("#rtime"); if (t) t.textContent = fmtT(now()); }, 500);
}
function nextLine() {
  if (!REC.active) return;
  const n = (state.job.entries || []).length;
  if (REC.i >= n - 1) return finishTake();
  REC.marks.push(now()); REC.i++; showLine();
}
function redoLine() {
  if (!REC.active) return;
  const t = now(); REC.cuts.push([REC.marks[REC.i], t]); REC.marks[REC.i] = t;
  const cur = document.querySelector(`#prompter .pl[data-k="${REC.i}"]`); if (cur) { cur.style.color = "#FFD23F"; setTimeout(() => cur.style.color = "", 600); }
  toast(`Line ${REC.i + 1}: read it again`);
}
function finishTake() { REC.active = false; REC.busy = true; clearInterval(REC.timer); drawRecBar(); REC.mr.stop(); }
function cancelTake() { if (!confirm("Stop and throw this take away?")) return; REC.active = false; clearInterval(REC.timer); REC.mr.onstop = null; REC.mr.stop(); showLine(); REC.i = 0; drawRecBar(); document.querySelectorAll("#prompter .pl").forEach(el => el.classList.remove("cur", "done")); }
async function uploadTake(blob, meta) {
  REC.busy = true; drawRecBar();
  try {
    const r = await fetch(`/api/jobs/${state.job.id}/recording`, { method: "POST", body: blob,
      headers: { "X-Filename": encodeURIComponent(blob.name || "take" + extFor(REC.mime)), "X-Meta": encodeURIComponent(JSON.stringify(meta || { marks: REC.marks, cuts: REC.cuts })) } });
    const d = await r.json(); if (!r.ok) throw new Error(d.error);
    micClose(); REC.busy = false; await refresh(true);
  } catch (e) { REC.busy = false; toast(e.message); drawRecBar(); }
}

function takesCard(j, v) {
  const t = j.takes || [];
  const rows = t.map((e, k) => `<div class="take ${e.flag ? "flag" : ""}" id="take-${k}">

    </div>`).join("");

async function retakeLine(k) {
  if (REC.busy || REC.active) return;
  if (!(await micOpen())) return;
  const row = $("#take-" + k), e = state.job.takes[k];
  row.insertAdjacentHTML("beforeend", `<div class="liverec" id="live"><div class="muted">Line ${k + 1}: press <b>Start</b>, read the line, then <b>Stop</b> (or <kbd>Space</kbd>).</div>
    <div class="big">${esc(e.subtitle)}</div><div class="row" style="align-items:center"><div class="meter"><div></div></div>
    <div style="flex:0;min-width:auto;display:flex;gap:8px" id="livebtn"><button class="btn primary" onclick="liveStart(${k})">● Start</button><button class="btn" onclick="liveClose()">Cancel</button></div></div></div>`);
  REC.busy = true;
}
function liveStart(k) {
  REC.line = k; REC.active = true;
  startRecorder(async (blob) => {
    $("#livebtn").innerHTML = `<span class="spin"></span> <span>Saving…</span>`;
    try {
      const r = await fetch(`/api/jobs/${state.job.id}/retake/${k}`, { method: "POST", body: blob, headers: { "X-Filename": encodeURIComponent("line" + extFor(REC.mime)) } });
      const d = await r.json(); if (!r.ok) throw new Error(d.error);
      toast(`Line ${k + 1} replaced`);
    } catch (err) { toast(err.message); }
    liveClose(); await refresh(true);
  });
  $("#livebtn").innerHTML = `<span><span class="recdot"></span>Recording</span><button class="btn primary" onclick="liveStop()">■ Stop</button>`;
}
function liveStop() { if (REC.mr && REC.mr.state === "recording") { REC.active = false; setTimeout(() => REC.mr.stop(), 350); } }
function liveClose() { REC.active = false; REC.busy = false; REC.line = null; $("#live")?.remove(); }
async function useHeard(k) { const e = state.job.takes[k]; await act("subtitle", { index: k, text: e.heard }); }

function afterRenderJob() {
  const j = state.job; if (!j) return;
  if (j.status === "record") {
    drawRecBar();
    if (REC.stream) fillMics(); else if (navigator.permissions?.query) navigator.permissions.query({ name: "microphone" }).then(p => { if (p.state === "granted") micOpen(); }).catch(() => {});
    const f = $("#recfile"); if (f) f.onchange = (e) => { const file = e.target.files[0]; if (file) uploadTake(Object.assign(file.slice(0, file.size, file.type), { name: file.name }), { marks: [], cuts: [] }); };
  }
  document.querySelectorAll(".subt").forEach(inp => inp.onchange = () => act("subtitle", { index: +inp.dataset.k, text: inp.value }));
}
document.addEventListener("keydown", (e) => {
  if (!REC.active) return;
  if (REC.line != null) { if (e.code === "Space") { e.preventDefault(); liveStop(); } return; }
  if (e.code === "Space" || (e.code === "Enter" && REC.i >= (state.job.entries || []).length - 1)) { e.preventDefault(); nextLine(); }
  else if (e.code === "KeyR") { e.preventDefault(); redoLine(); }
  else if (e.code === "Escape") cancelTake();
});
window.addEventListener("beforeunload", (e) => { if (REC.active || REC.busy) { e.preventDefault(); e.returnValue = ""; } });

function render() {
  renderJobs();
  if (state.view === "new") renderNew();
  else if (state.view === "settings") renderSettings();
  else if (state.view === "plans") renderPlans();
  else renderJob();
}

let lastSig = "";
async function refresh(force = false) {
  try {
    state.jobs = await api("/api/jobs");
    renderJobs();
    if (state.view === "plans" && (force || state.plans.some(p => p.status === "planning"))) await refreshPlans();
    if (state.view === "settings" && (force || state.pick?.status === "running")) {
      const before = JSON.stringify(state.pick); state.pick = await api("/api/voice-pick");
      if (JSON.stringify(state.pick) !== before) renderPick();
    }
    if (state.view.startsWith("job:")) {
      const j = await api(`/api/jobs/${state.view.slice(4)}`);
      const sig = JSON.stringify([j.status, j.updated, j.log.length, j.files, j.youtube.length]);
      if (force || sig !== lastSig || !state.job) {
        const statusChanged = state.job && state.job.status !== j.status;
        state.job = j; lastSig = sig;
        const typing = ["notes", "narr", "th-h", "th-s", "th-f", "sh-t", "sh-a", "sh-b"].includes(document.activeElement?.id) || document.activeElement?.classList.contains("subt");
        if (REC.active || REC.busy) { /* never redraw under the teleprompter or a line recording */ }
        else if (!typing || statusChanged || force) renderJob();
        else { const log = $("#log"); if (log) { const stick = log.scrollHeight - log.scrollTop - log.clientHeight < 30; log.textContent = j.log; if (stick) log.scrollTop = log.scrollHeight; } }
      }
    }
  } catch (e) { /* server restarting */ }
}

(async () => {
  [state.settings, state.health] = await Promise.all([api("/api/settings"), api("/api/health")]);
  state.view = location.hash.startsWith("#job:") ? location.hash.slice(1) : "new";
  render(); refresh(true);
  setInterval(refresh, 2000);
})();
document.addEventListener("wheel", () => { const el = document.activeElement; if (el && el.type === "number") el.blur(); }, { passive: true });
window.addEventListener("hashchange", () => { if (location.hash.startsWith("#job:") && location.hash.slice(1) !== state.view) go(location.hash.slice(1)); });
</script>
</body>
</html>
